# JVM args for Gradle. 2g is plenty for this single-module app.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# Parallel + cache = faster incremental builds.
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# AndroidX (required by all modern AndroidX artifacts).
android.useAndroidX=true

# Kotlin code style.
kotlin.code.style=official

# Only bundle the resources actually referenced (smaller APK/AAB).
android.nonTransitiveRClass=true
android.nonFinalResIds=true
